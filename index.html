<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Haiku Generator By shazim</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="overlay"></div>

  <div class="container">

    <h1>Weather Haiku</h1>

    <div class="weather-box">
      <h2 id="city">Loading...</h2>
      <p id="weather">Fetching weather...</p>
      <p id="temp"></p>
    </div>

    <div class="haiku-box">
      <p id="haiku"></p>
    </div>

    <button id="newHaiku">Load New Haiku</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
